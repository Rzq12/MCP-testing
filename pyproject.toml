[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seirama-mcp"
version = "0.1.0"
description = "MCP server untuk data SEIRAMA dan pencarian dokumen"
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "clickhouse-connect",
  "python-dotenv",
  "pypdf",
  "qdrant-client[fastembed]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
